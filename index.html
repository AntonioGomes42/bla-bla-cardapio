<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bla Bla – Lanchonete & Pizzaria · Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#7F1F20;--gold:#E8D19A;--aged:#B99A5B;--char:#292725;--ivory:#F7F0DF;--beige:#D8C6A0;--ink:#170c0c;
--serif:'Jost',system-ui,sans-serif;--script:'Jost',system-ui,sans-serif;--sans:'Jost',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;color:var(--ivory);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:96px;min-height:100vh;
background:radial-gradient(120% 55% at 50% -5%,#7F1F20 0%,#4a1213 38%,var(--ink) 75%) no-repeat,var(--ink);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:12px;padding-top:16px;padding-bottom:16px}
.hd{position:sticky;top:0;z-index:20;margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:rgba(121,29,30,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(232,209,154,.25)}
.logo{flex:1 0 auto;display:flex;padding:0 0 0 10px}
.srch{display:flex;align-items:center;width:44px;height:44px;flex:0 1 auto;border-radius:22px;background:rgba(247,240,223,.12);border:1px solid rgba(247,240,223,.18);overflow:hidden;transition:width .3s ease,background .2s,border-color .2s;backdrop-filter:blur(6px)}
.srch.open{width:100%;max-width:320px;background:rgba(0,0,0,.4);border-color:var(--aged)}
.srch:focus-within{border-color:var(--gold)}
.sbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;color:var(--gold)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ivory);font:16px var(--sans);padding:0 2px}
.srch input::placeholder{color:var(--beige);opacity:.8}
.srch input::-webkit-search-cancel-button{display:none}
.sx{flex:none;width:34px;height:34px;margin-right:3px;border-radius:50%;color:var(--beige);font-size:.85rem}
.srch:not(.open) input,.srch:not(.open) .sx{visibility:hidden}
.hw{position:relative}
.ar{display:none}
@media(min-width:641px){.ar{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(20,10,10,.5);border:1px solid rgba(232,209,154,.35);color:var(--gold);font-size:1.3rem;line-height:1;padding-bottom:2px;backdrop-filter:blur(4px);opacity:.8;transition:opacity .2s,background .2s,visibility 0s}.ar:hover{opacity:1;background:rgba(20,10,10,.85)}.ar.l{left:-16px}.ar.r{right:-16px}.ar.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s .2s}}
@keyframes sin{from{opacity:0;transform:translateY(-50%) scaleX(.7)}}
@media(max-width:640px){
.top{position:relative}
.top.so .logo{visibility:hidden}
.srch.open{position:absolute;z-index:2;left:18px;right:18px;top:50%;width:auto;max-width:none;transform:translateY(-50%);transform-origin:right center;animation:sin .22s ease}
}
.logo svg{display:block;width:clamp(68px,19vw,90px);height:auto}
.ib{width:44px;height:44px;border-radius:50%;background:rgba(247,240,223,.12);border:1px solid rgba(247,240,223,.18);display:grid;place-items:center;font-size:1.1rem;position:relative;flex:none;backdrop-filter:blur(6px)}
.sbox{display:none;margin:8px 0}.sbox.on{display:block}
.sbox input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--aged);color:var(--ivory);border-radius:16px;padding:13px 16px;font:inherit}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:12px -18px 0;padding:0 18px}
.hero::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;min-height:178px;border-radius:26px;padding:22px;position:relative;overflow:hidden;background:linear-gradient(120deg,#1a0d0d 0%,#3d1011 55%,#7F1F20 140%);border:1px solid rgba(232,209,154,.25);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
.sl small{font:600 .8rem var(--serif);color:var(--gold)}
.sl h2{margin:0;font:800 clamp(1.8rem,7vw,2.6rem)/.95 var(--serif);color:var(--ivory);max-width:60%;white-space:pre-line}
.sl .em{position:absolute;right:-4px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:7.5rem;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.cta{background:var(--gold);color:var(--wine);font-weight:700;font-size:.85rem;border-radius:20px;padding:9px 18px;margin-top:8px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(247,240,223,.35);transition:.2s}
.dots i.on{background:var(--ivory);width:16px;border-radius:4px}
.pills{display:flex;gap:10px;overflow-x:auto;padding:12px 18px 6px;margin:0 -18px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid rgba(247,240,223,.14);border-radius:26px;padding:6px 18px 6px 6px;font-weight:500;transition:.2s}
.pill i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;background:rgba(232,209,154,.14);transition:.2s}
.pill:hover{border-color:var(--aged)}
.pill.on{background:var(--ivory);color:var(--wine);font-weight:700;border-color:var(--ivory)}
.pill.on i{background:rgba(127,31,32,.14)}
.sec{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(185,154,91,.65),transparent)}
.sec h2{margin:0;font:700 1.35rem var(--serif);color:var(--gold)}
.sec small{color:var(--beige);font-size:.78rem;background:rgba(0,0,0,.35);border:1px solid rgba(232,209,154,.18);border-radius:12px;padding:2px 9px;white-space:nowrap}
.si{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:rgba(232,209,154,.12);border:1px solid rgba(232,209,154,.35)}
.sh{margin:24px 0 12px;font:700 1.35rem var(--serif);color:var(--gold)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-top:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-align:left;background:linear-gradient(165deg,#3c1819 0%,#1b1010 70%);border:1px solid rgba(232,209,154,.14);border-radius:24px;padding:14px;display:flex;flex-direction:column;position:relative;transition:.2s;width:100%}
.card:hover{transform:translateY(-3px);border-color:var(--aged)}
.nm{font:600 .95rem/1.25 var(--sans);min-height:2.4em}
.st{font-size:.72rem;color:var(--beige);margin-top:6px}
.pr{display:flex;align-items:baseline;gap:7px;font-weight:700;color:var(--gold);padding-right:44px}
.pr s{font-weight:400;font-size:.78rem;color:var(--beige);opacity:.7}
.pl{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:var(--ivory);color:var(--wine);font-size:1.4rem;font-weight:700;display:grid;place-items:center}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 172px;scroll-snap-align:start}
.ban{display:block;width:100%;text-align:left;position:relative;overflow:hidden;min-height:150px;border-radius:26px;padding:22px;margin-bottom:12px;background:linear-gradient(110deg,#170c0c 0%,#4a1213 60%,#7F1F20 130%);border:1px solid rgba(232,209,154,.2)}
.ban h3{margin:0;font:800 1.9rem/1 var(--serif);max-width:58%}
.ban p{margin:6px 0 0;color:var(--gold);font-weight:700}
.ban s{color:var(--beige);font-weight:400;margin-right:6px}
.ban .em{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-10deg);font-size:6.5rem;filter:drop-shadow(0 12px 12px rgba(0,0,0,.6))}
.empty{text-align:center;color:var(--beige);padding:30px}
.ov{position:fixed;inset:0;background:rgba(10,4,4,.72);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{position:relative;background:linear-gradient(180deg,#3a1617,#1b1010 45%);border:1px solid rgba(232,209,154,.3);border-radius:32px 32px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:80px 20px calc(20px + env(safe-area-inset-bottom,0px));margin-top:70px;animation:up .28s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:32px}}
.big{position:absolute;top:-46px;left:50%;transform:translateX(-50%);font-size:6rem;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.big.pin{position:static;display:block;transform:none;width:112px;height:112px;margin:-64px auto 6px;font-size:0;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.pinfx{animation:pbob 3s ease-in-out infinite}
@keyframes pbob{50%{transform:translateY(-4px)}}
.x{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;background:rgba(247,240,223,.12);color:var(--gold)}
.sheet h3{margin:0;font:700 1.4rem var(--serif)}
.ds{color:var(--beige);font-size:.88rem;margin:6px 0 0}
.lb{font:600 .95rem var(--serif);color:var(--gold);margin:18px 0 10px}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 4px 0;scrollbar-width:none}
.tl{flex:0 0 78px;background:rgba(247,240,223,.08);border:1px solid transparent;border-radius:18px;padding:10px 4px;text-align:center;font-size:.7rem;color:var(--beige);position:relative}
.tl i{display:block;font-style:normal;font-size:1.7rem}
.tl em{display:block;font-style:normal;font-weight:700;margin-top:2px}
.tl.on{border-color:var(--gold);background:rgba(232,209,154,.16);color:var(--gold)}
.tl .pl{width:24px;height:24px;font-size:1rem;right:-4px;top:-6px;bottom:auto}
.obs{width:100%;background:rgba(247,240,223,.08);border:1px solid transparent;border-radius:14px;color:var(--ivory);padding:12px 14px;font:inherit}
.act{display:flex;gap:12px;margin-top:22px;align-items:center}
.qty{display:flex;align-items:center;gap:12px;background:rgba(247,240,223,.08);border-radius:30px;padding:5px}
.qty button{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:var(--gold);font-size:1.2rem}
.qty b{min-width:18px;text-align:center}
.btn{flex:1;background:var(--ivory);color:var(--wine);font-weight:700;border-radius:30px;padding:14px 20px;transition:.2s}
.btn:hover{background:var(--gold)}
a.btn.lnk{display:block;text-align:center;text-decoration:none;flex:1}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(232,209,154,.25)}
.line small{display:block;color:var(--beige);font-size:.78rem}
.rm{font-size:.75rem;color:var(--beige);text-decoration:underline;margin-top:4px}
.tot{display:flex;justify-content:space-between;font:700 1.2rem var(--serif);color:var(--gold);margin:16px 0 12px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--wine);font-weight:700;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:.3s;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:900px){.sl{flex-basis:calc(50% - 6px);min-height:200px}.hero{margin:12px 0 0;padding:0}.rail .card{flex-basis:210px}}
.ph{aspect-ratio:4/3;border-radius:16px;overflow:hidden;margin-bottom:10px;background:#1b1010}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.sli{position:absolute;right:0;top:0;bottom:0;width:58%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.sl>*:not(.sli),.ban>*:not(.sli){position:relative;z-index:1}
.sl h2,.ban h3{text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sheet.det{display:flex;flex-direction:column;padding:0;margin-top:0;height:92vh;overflow:hidden;background:#1b1010}
@media(min-width:640px){.sheet.det{height:min(92vh,780px)}}
.det .x{z-index:5;background:var(--ivory);color:var(--wine);box-shadow:0 4px 12px rgba(0,0,0,.35);font-size:1.1rem}
.dsc{flex:1;overflow:auto}
.dimg{height:clamp(230px,38vh,320px)}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dbody{position:relative;margin-top:-26px;background:#1b1010;border-radius:28px 28px 0 0;padding:22px 20px 20px}
.dcat{color:var(--beige);font-size:.78rem}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:2px}
.dmeta{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.dmeta span{background:rgba(232,209,154,.12);border:1px solid rgba(232,209,154,.25);color:var(--gold);border-radius:20px;padding:4px 12px;font-size:.82rem}
.lr{display:flex;justify-content:space-between;align-items:baseline}
.lr span{font:700 .9rem var(--sans);color:var(--beige)}
.ad{flex:0 0 112px;position:relative;border:2px solid transparent;border-radius:18px;overflow:hidden;background:rgba(247,240,223,.06);text-align:center;transition:.2s}
.ad img{display:block;width:100%;height:88px;object-fit:cover}
.ad .pt{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:var(--gold);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px}
.ad .ck{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--wine);display:none;place-items:center;font-size:.75rem;font-weight:700;font-style:normal}
.ad .n{display:block;padding:7px 4px;font-size:.76rem;color:var(--beige)}
.ad.on{border-color:var(--gold)}.ad.on .ck{display:grid}.ad.on .n{color:var(--gold);font-weight:700}
.dft{flex:none;display:flex;gap:12px;align-items:center;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:#1b1010;border-top:1px solid rgba(232,209,154,.18)}
.tw{position:relative}
.tw .ar.l{left:-10px}.tw .ar.r{right:-10px}
textarea.obs{display:block;resize:none;min-height:84px;line-height:1.45;font-size:16px;overflow:hidden;white-space:pre-wrap;word-wrap:break-word}
.chd{flex:none;padding:20px 70px 12px;text-align:center}
.chd h3{margin:0;font:700 1.15rem var(--serif);color:var(--ivory)}
.cbody{padding:4px 20px 28px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid rgba(232,209,154,.2);border-radius:22px;padding:4px}
.seg button{flex:1;padding:8px 4px;border-radius:18px;font-weight:700;font-size:.88rem;color:var(--beige);line-height:1.25;transition:.2s}
.seg small{display:block;font-weight:400;font-size:.68rem;opacity:.85}
.seg button.on{background:var(--ivory);color:var(--wine)}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(232,209,154,.15)}
.ci img{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cin>b{font:700 .98rem var(--serif)}
.cp{font-size:.76rem;color:var(--beige)}
.qs{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:6px;background:rgba(247,240,223,.08);border-radius:20px;padding:3px}
.qs button{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);color:var(--gold);font-size:1rem;line-height:1}
.qs button:last-child{background:var(--gold);color:var(--wine)}
.qs b{min-width:16px;text-align:center;font:600 .9rem var(--sans)}
.cr{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;flex:none}
.trash{color:var(--beige);padding:2px}
.cpr{font-weight:700;color:var(--gold)}
.csc .obs{font-size:16px;margin-bottom:10px;min-height:0;border-color:rgba(232,209,154,.18)}
.csc .obs::placeholder{color:var(--beige);opacity:.7}
.info{background:rgba(247,240,223,.06);border:1px solid rgba(232,209,154,.18);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.info span{color:var(--beige);font-size:.8rem}
.pays{display:flex;gap:8px}
.pay{flex:1;padding:11px 6px;border-radius:14px;border:1px solid rgba(232,209,154,.25);background:rgba(247,240,223,.06);font-weight:600;font-size:.88rem;transition:.2s}
.pay.on{background:var(--gold);color:var(--wine);border-color:var(--gold)}
.cup{display:flex;gap:8px}
.cup .obs{flex:1;margin-bottom:0}
.cbtn{flex:none;padding:0 18px;border-radius:14px;background:var(--gold);color:var(--wine);font-weight:700}
.cmsg{margin:8px 2px 0;font-size:.8rem;color:var(--gold)}
.sum{background:rgba(247,240,223,.06);border:1px solid rgba(232,209,154,.15);border-radius:18px;padding:12px 16px}
.sr{display:flex;justify-content:space-between;font-size:.9rem;color:var(--beige);padding:4px 0}
.sr.t{border-top:1px solid rgba(232,209,154,.2);margin-top:6px;padding-top:10px;font:700 1.05rem var(--serif);color:var(--gold)}
.sheet.det.emp{height:auto;max-height:92vh}
.emp{text-align:center;padding-top:6px}
.emp svg{animation:fl 3.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.emp h4{margin:10px 0 4px;font:700 1.35rem var(--serif);color:var(--gold)}
.emp p{margin:0 auto 18px;max-width:280px;color:var(--beige);font-size:.9rem}
.emp .lb{text-align:left;margin-top:28px}
.sug{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}
.sg{border-radius:16px;overflow:hidden;background:rgba(247,240,223,.06);border:1px solid rgba(232,209,154,.15);transition:.2s}
.sg:hover{border-color:var(--aged)}
.sg img{display:block;width:100%;height:84px;object-fit:cover}
.sg span{display:block;padding:8px 10px 0;font:700 .85rem var(--serif)}
.sg em{display:block;padding:0 10px 10px;font-style:normal;color:var(--gold);font-weight:700;font-size:.85rem}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;background:var(--gold);color:var(--wine);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 3px rgba(121,29,30,.9);transition:background .2s}
.fab:hover{background:var(--aged)}
.fab.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.fab .bd{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--wine);color:var(--gold);border:2px solid var(--gold);font:700 .72rem var(--sans);display:none;place-items:center;padding:0 5px;font-style:normal}
.fab .bd.on{display:grid}
.hl,.hr .hloc{display:none}
.hr{display:flex;align-items:center;gap:8px}
.btn.sec{background:rgba(247,240,223,.08);color:var(--gold);border:1px solid rgba(232,209,154,.3)}
.btn.sec:hover{background:rgba(232,209,154,.18)}
@media(min-width:641px){
html{scroll-padding-top:128px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:clamp(64px,calc(20vw - 64px),240px);padding-top:8px;padding-bottom:8px}
.hl{display:flex;grid-column:1;justify-self:end;gap:6px}
.logo{grid-column:2;justify-self:center;padding:0}
.logo svg{width:clamp(96px,9vw,112px)}
.hr{grid-column:3;justify-self:start}
.hr .hloc{display:flex}
.top.so .hloc{display:none}
.srch.open{width:240px;max-width:none}
.hb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;font:600 .9rem var(--sans);color:var(--beige);border:1px solid transparent;white-space:nowrap;transition:.2s}
.hb:hover{background:rgba(232,209,154,.12);color:var(--gold)}
.hb.on{background:var(--ivory);color:var(--wine)}
.hb .ic{display:none}
.hloc{border-color:rgba(232,209,154,.3);color:var(--gold)}
}
@media(min-width:900px){.hb .ic{display:inline}.hb{padding:0 18px}}

.hb::before{bottom:7px}

.hb.on::before,.hb.on::after{opacity:1;transform:scaleX(1)}
.hl{gap:28px}
.hloc{border:1px solid rgba(232,209,154,.55);border-radius:10px;padding:0 16px;box-shadow:1px 1px 0 var(--char);color:var(--gold)}
.hloc::before,.hloc::after{display:none}
.hloc:hover{border-color:var(--gold);background:rgba(232,209,154,.08);color:var(--ivory)}
.hb .ic{filter:drop-shadow(1px 1px 0 var(--char))}
.srch{background:transparent;border-color:rgba(232,209,154,.55);color:var(--gold)}
.srch .sbtn{filter:drop-shadow(1px 1px 0 var(--char))}

/* Logo maior, com a ponta da pizza transbordando para fora do header */

.logo{align-self:start;margin-bottom:calc(var(--lo)*-1)}
.logo svg{width:var(--lw)}
#view{padding-top:calc(var(--lo) - 6px)}

.hamb{display:none;width:44px;height:44px;flex:none;border-radius:22px;background:rgba(247,240,223,.12);border:1px solid rgba(247,240,223,.18);color:var(--gold);place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

@media(max-width:640px){

.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:8px;align-items:center}

.drl{padding:8px 14px}
.dri{display:flex;align-items:center;gap:14px;width:100%;padding:17px 8px;border-bottom:1px solid rgba(232,209,154,.14);font:500 1.05rem 'Jost',var(--sans);letter-spacing:.1em;color:rgba(232,209,154,.75);text-align:left;transition:color .2s,background .2s}

.dri .ch{margin-left:auto;opacity:.45}
.dri.on{color:var(--ivory)}

.drf b:not(:first-child){margin-top:10px}
